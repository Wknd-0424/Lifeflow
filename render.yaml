services:
  - type: web
    name: lifeflow
    runtime: node
    plan: starter
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/bloodbank.sqlite
    disk:
      name: lifeflow-data
      mountPath: /var/data
      sizeGB: 1
