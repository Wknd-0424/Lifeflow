<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in · LifeFlow</title>
  <link rel="icon" href="/lifeflow-mark.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/glass.css?v=admin-login">
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card glass-card">
    <img src="/lifeflow-mark.svg" alt="" width="56" height="56">
    <h1>LifeFlow</h1>
    <p class="subtitle">Admin sign in</p>
    <form id="admin-login" method="post">
      <div class="field">
        <label for="password">Admin password</label>
        <input id="password" type="password" autocomplete="current-password" required maxlength="1024">
      </div>
      <p id="login-error" role="alert"></p>
      <button type="submit" class="button primary">Sign in</button>
    </form>
  </main>
</body>
</html>
